name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tag igual à versão do projeto
        run: test "${GITHUB_REF_NAME#v}" = "$(./gradlew -q :paper:properties --property version --no-daemon | awk '/^version:/{print $2}')"
      - run: ./gradlew build --no-daemon
      # Nome fixo além do versionado: o painel da Rivoo baixa sempre
      # releases/latest/download/rivoo-minecraft-paper.jar.
      - run: cp paper/build/libs/rivoo-minecraft-paper-*.jar paper/build/libs/rivoo-minecraft-paper.jar
      - uses: softprops/action-gh-release@v2
        with:
          files: paper/build/libs/rivoo-minecraft-paper*.jar
          generate_release_notes: true
